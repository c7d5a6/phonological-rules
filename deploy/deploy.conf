# deploy/deploy.conf  -- the only per-project deploy file (see DEPLOY-RULES.md in the infra repo)
NAME=ph-lib
DOMAIN=api.language.owlbeardm.com
PORT=3003
START=./phonological-rules-backend
HEALTH=/api/version
SHARED=()
# Baz refuses ReleaseFast/ReleaseSmall (keeps its invariants on), so ReleaseSafe.
build() {
  zig build -Doptimize=ReleaseSafe -Dtarget="$ZIG_TARGET" --prefix "$OUT/.p"
  mv "$OUT/.p/bin/phonological-rules-backend" "$OUT/"
  mkdir -p "$OUT/libs"
  find "$OUT/.p/lib" -maxdepth 1 \( -name '*.so' -o -name '*.so.*' \) -exec cp -a {} "$OUT/libs/" \;
  rm -rf "$OUT/.p"
}
